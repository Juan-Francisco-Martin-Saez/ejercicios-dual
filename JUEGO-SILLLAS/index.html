<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Juego de las sillas</title>

  <link rel="stylesheet" href="./styles.css">

</head>

<body>

  <!-- JUEGO -->

  <main id="pantalla-juego" class="pantalla-juego">

    <!-- CABECERA -->

    <header class="cabecera">

      <div class="logo-juego">
        <span class="logo-punto"></span>
        <span>LAS SILLAS</span>
      </div>

      <div class="marcador">

        <div class="marcador-dato">
          <small>SILLAS</small>
          <strong id="numero-sillas">6</strong>
        </div>

        <div class="marcador-dato">
          <small>JUGADORES</small>
          <strong id="numero-jugadores">7</strong>
        </div>

        <div class="marcador-dato tu-dato">
          <small>TÚ</small>
          <strong id="tu-jugador">-</strong>
        </div>

        <div class="marcador-dato ronda-dato">
          <strong id="ronda">ELECCIÓN</strong>
        </div>

      </div>

      <div id="estado" class="estado">
        ELIGE JUGADOR
      </div>

    </header>

    <!-- TABLERO -->

    <section class="tablero">

      <div class="tablero-borde"></div>

      <div class="tablero-esquina esquina-1"></div>
      <div class="tablero-esquina esquina-2"></div>
      <div class="tablero-esquina esquina-3"></div>
      <div class="tablero-esquina esquina-4"></div>
      <div class="linea-horizontal linea-1"></div>
      <div class="linea-horizontal linea-2"></div>
      <div class="linea-vertical linea-3"></div>
      <div class="linea-vertical linea-4"></div>

      <div class="zona-juego"></div>

      <!-- SILLAS -->

      <div id="sillas" class="sillas"></div>

      <!-- JUGADORES -->

      <div id="personajes" class="personajes"></div>

      <!-- SELECCIÓN -->

      <div id="selector-juego" class="selector-juego">

        <div class="selector-panel">

          <div class="selector-etiqueta">
            NUEVA PARTIDA
          </div>

          <h1>Elige tu jugador</h1>

          <p>
            Escoge una ficha y prepárate para
            encontrar una silla.
          </p>

          <div id="seleccion-jugadores" class="seleccion-jugadores">
          </div>

          <button id="comenzar" class="boton boton-principal" disabled>
            EMPEZAR PARTIDA
          </button>

        </div>

      </div>

    </section>

    <!-- CONTROLES -->

    <footer class="controles">

      <div id="mensaje" class="mensaje">
        Elige tu personaje
      </div>

      <button id="parar" class="boton boton-parar" disabled>
        PARAR
      </button>

      <button id="comenzar-ronda" class="boton boton-ronda" disabled>
        EMPEZAR RONDA
      </button>

    </footer>

  </main>

  <!-- PANTALLA FINAL -->

  <section id="pantalla-final" class="pantalla-final">

    <div class="gameover-panel">

      <div id="resultado" class="resultado"></div>

      <button id="reiniciar" class="boton boton-principal">
        NUEVA PARTIDA
      </button>

    </div>

  </section>

  <script src="./script.js"></script>

</body>

</html>
