<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: hsl(0, 0%, 93%);
      font-family: Arial, sans-serif;
    }

    .calculadora {
      width: 20rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      padding: 1rem;
      background: hsl(0, 0%, 100%);
      border: 0.125rem solid hsl(0, 0%, 0%);
    }

    .pantalla {
      height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.625rem;
      background: hsl(0, 0%, 96%);
      border: 0.125rem solid hsl(0, 0%, 0%);
      overflow: hidden;
    }

    .valor-pantalla {
      width: 15ch;
      font-family: 'Roboto Mono', monospace;
      font-size: 1.875rem;
      text-align: right;
      white-space: nowrap;
    }

    .panel {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }

    .tecla {
      height: 3.5rem;
      background: hsl(0, 0%, 100%);
      border: 0.125rem solid hsl(0, 0%, 0%);
      font-size: 1.125rem;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
    }

    .tecla:hover {
      background: hsl(96, 96%, 72%);
    }

    .tecla:active {
      background: hsl(0, 0%, 80%);
      transform: scale(0.95);
    }

    .control {
      background: hsl(0, 0%, 87%);
    }

    .operador {
      background: hsl(0, 0%, 18%);
      color: hsl(0, 0%, 100%);
    }

    .operador:hover {
      background: hsl(96, 90%, 31%);
    }

    .operador:active {
      background: hsl(0, 0%, 33%);
    }

    .cero {
      grid-column: span 2;
    }

    .igual {
      grid-column: 1 / -1;
      background: hsl(0, 0%, 80%);
    }
  </style>

</head>

<body>

  <div class="calculadora">

    <div class="pantalla">
      <div class="valor-pantalla">0</div>
    </div>

    <div class="panel">

      <button class="tecla control">C</button>
      <button class="tecla control">⌫</button>
      <button class="tecla operador">(</button>
      <button class="tecla operador">)</button>

      <button class="tecla">7</button>
      <button class="tecla">8</button>
      <button class="tecla">9</button>
      <button class="tecla operador">÷</button>

      <button class="tecla">4</button>
      <button class="tecla">5</button>
      <button class="tecla">6</button>
      <button class="tecla operador">×</button>

      <button class="tecla">1</button>
      <button class="tecla">2</button>
      <button class="tecla">3</button>
      <button class="tecla operador">−</button>

      <button class="tecla cero">0</button>
      <button class="tecla">.</button>
      <button class="tecla operador">+</button>

      <button class="tecla igual">=</button>

    </div>

  </div>

  <script>

    const calculadora = document.querySelector('.calculadora')
    const pantalla = document.querySelector('.valor-pantalla')

    let expresion = ''

    calculadora.addEventListener('click', (event) => {

      if (!event.target.classList.contains('tecla')) return

      const valor = event.target.textContent

      console.log(valor)

      if (valor === 'C') {
        expresion = ''
        pantalla.textContent = '0'
        return
      }

      if (valor === '⌫') {
        expresion = expresion.slice(0, -1)
        pantalla.textContent = expresion || '0'
        return
      }

      if (valor === '=') {
        try {
          expresion = String(eval(expresion.replaceAll('×', '*').replaceAll('÷', '/').replaceAll('−', '-')))
          pantalla.textContent = expresion
        } catch {
          expresion = ''
          pantalla.textContent = 'Error'
        }
        return
      }

      if ('+−×÷'.includes(valor)) {
        if (!expresion || '+−×÷'.includes(expresion.slice(-1))) return
      }

      if (valor === '.') {
        const numero = expresion.split(/[+−×÷()]/).pop()
        if (numero.includes('.')) return
      }

      if (expresion.length >= 15) return

      expresion += valor
      pantalla.textContent = expresion
    })

  </script>

</body>

</html>
