<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculadora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: hsl(0, 0%, 93%);
      font-family: Arial, sans-serif;
    }

    .calculadora {
      width: 20rem;

      display: flex;
      flex-direction: column;
      gap: 1rem;

      padding: 1rem;

      background: hsl(0, 0%, 100%);
      border: 0.125rem solid hsl(0, 0%, 0%);
    }

    .pantalla {
      height: 4.5rem;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0.625rem;

      background: hsl(0, 0%, 96%);
      border: 0.125rem solid hsl(0, 0%, 0%);

      overflow: hidden;
    }

    .valor-pantalla {
      width: 15ch;

      font-family: 'Roboto Mono', monospace;
      font-size: 1.875rem;
      text-align: right;
      white-space: nowrap;
    }

    .panel {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }

    .tecla {
      height: 3.5rem;

      background: hsl(0, 0%, 100%);
      border: 0.125rem solid hsl(0, 0%, 0%);

      font-size: 1.125rem;

      cursor: pointer;

      transition: background 0.1s, transform 0.1s;
    }

    .tecla:hover {
      background: hsl(96, 96%, 72%);
    }

    .tecla:active {
      background: hsl(0, 0%, 80%);
      transform: scale(0.95);
    }

    .control {
      background: hsl(0, 0%, 87%);
    }

    .operador {
      background: hsl(0, 0%, 18%);
      color: hsl(0, 0%, 100%);
    }

    .operador:hover {
      background: hsl(96, 90%, 31%);
    }

    .operador:active {
      background: hsl(0, 0%, 33%);
    }

    .cero {
      grid-column: span 2;
    }

    .igual {
      grid-column: span 2;
      background: hsl(0, 0%, 80%);
    }
  </style>

</head>

<body>

  <div class="calculadora">

    <div class="pantalla">
      <div class="valor-pantalla">0</div>
    </div>

    <div class="panel">

      <button class="tecla control">C</button>
      <button class="tecla control">⌫</button>
      <button class="tecla operador">(</button>
      <button class="tecla operador">)</button>

      <button class="tecla">7</button>
      <button class="tecla">8</button>
      <button class="tecla">9</button>
      <button class="tecla operador">÷</button>

      <button class="tecla">4</button>
      <button class="tecla">5</button>
      <button class="tecla">6</button>
      <button class="tecla operador">×</button>

      <button class="tecla">1</button>
      <button class="tecla">2</button>
      <button class="tecla">3</button>
      <button class="tecla operador">−</button>

      <button class="tecla cero">0</button>
      <button class="tecla">.</button>
      <button class="tecla operador">+</button>

      <button class="tecla igual">=</button>
      <button class="tecla operador mas-menos">%</button>
      <button class="tecla operador mas-menos">+/-</button>

    </div>

  </div>

  <script>

    const calculadora = document.querySelector('.calculadora')
    const pantalla = document.querySelector('.valor-pantalla')

    let expresion = ''
    const operadores = '+−×÷'
    const mostrar = () => pantalla.textContent = expresion || '0'
    const contar = (simbolo) => (expresion.match(new RegExp(`\\${simbolo}`, 'g')) || []).length

    calculadora.addEventListener('click', (event) => {

      if (!event.target.classList.contains('tecla')) return

      const valor = event.target.textContent
      const ultimo = expresion.slice(-1)

      // C
      if (valor === 'C') expresion = ''

      // ⌫
      else if (valor === '⌫') expresion = expresion.slice(0, -1)

      // +/-
      else if (valor === '+/-') {

        const numero = expresion.match(/−?\d*\.?\d+$/)
        if (!numero) return

        const inicio = expresion.length - numero[0].length

        expresion = numero[0].startsWith('−')
          ? expresion.slice(0, inicio) + numero[0].slice(1)
          : expresion.slice(0, inicio) + '−' + numero[0]

        // =
      } else if (valor === '=') {

        try {

          let nivel = 0

          for (const c of expresion) {
            nivel += c === '(' ? 1 : c === ')' ? -1 : 0
            if (nivel < 0) throw new Error()
          }

          if (!expresion || nivel || operadores.includes(ultimo) ||
            ultimo === '(' || ultimo === '.') throw new Error()

          expresion = String(eval(
            expresion
              .replaceAll('×', '*')
              .replaceAll('÷', '/')
              .replaceAll('−', '-')
              .replace(/(−?\d*\.?\d+)%/g, '($1/100)')
          ))

          if (!Number.isFinite(Number(expresion))) throw new Error()

        } catch {
          expresion = ''
          pantalla.textContent = 'Error'
          return
        }

        // (
      } else if (valor === '(') {

        if (ultimo && !operadores.includes(ultimo) && ultimo !== '(') return
        expresion += valor

        // )
      } else if (valor === ')') {

        if (
          !expresion ||
          ultimo === '(' ||
          operadores.includes(ultimo) ||
          contar(')') >= contar('(')
        ) return

        expresion += valor

        // Operadores
      } else if (operadores.includes(valor)) {

        if (!expresion && valor !== '−') return
        if (ultimo === '(' && valor !== '−') return
        if (ultimo === ')' || ultimo === '−') return
        if (operadores.includes(ultimo) && valor !== '−') return

        expresion += valor

        // %
      } else if (valor === '%') {

        if (!/\d/.test(ultimo)) return
        expresion += valor

        // .
      } else if (valor === '.') {

        const numero = expresion.split(/[+−×÷()]/).pop()

        if (ultimo === ')' || ultimo === '%' || numero.includes('.')) return

        expresion += numero ? '.' : '0.'

        // Números
      } else {

        if (ultimo === ')' || ultimo === '%') return
        expresion += valor
      }

      if (expresion.length > 15) expresion = expresion.slice(0, 15)

      mostrar()
    })

  </script>

</body>

</html>
