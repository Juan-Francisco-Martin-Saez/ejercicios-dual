<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica JavaScript</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="zona-movimiento">

    <div class="tablero">

      <div class="cubo"></div>

    </div>

  </div>

  <div class="interaccion">

    <div class="panel-direcciones">

      <button class="boton-mover arriba-izquierda">↖</button>
      <button class="boton-mover arriba">↑</button>
      <button class="boton-mover arriba-derecha">↗</button>

      <button class="boton-mover izquierda">←</button>
      <button class="boton-mover reset">↺</button>
      <button class="boton-mover derecha">→</button>

      <button class="boton-mover abajo-izquierda">↙</button>
      <button class="boton-mover abajo">↓</button>
      <button class="boton-mover abajo-derecha">↘</button>

    </div>

    <script type="module" src="./script.js"></script>

</body>

</html>
