<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
  (() => {
    const datos = JSON.parse(document.getElementById("datos-resultado").textContent);
    const meses = [
      "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
      "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
    ];

    const anios = Object.keys(datos)
      .filter((anio) => /^\d{4}$/.test(anio))
      .sort((a, b) => Number(a) - Number(b));

    const colores = anios.map((_, indice) => {
      const tono = Math.round((indice * 360) / anios.length);
      return `hsl(${tono} 68% 43%)`;
    });

    const datasets = anios.map((anio, indice) => {
      const cantidadesPorMes = new Map(
        datos[anio].map(({ mes, cantidad }) => [Number(mes), Number(cantidad)])
      );

      return {
        label: anio,
        data: meses.map((_, indiceMes) => cantidadesPorMes.get(indiceMes + 1) ?? null),
        borderColor: colores[indice],
        backgroundColor: colores[indice],
        borderWidth: 2,
        pointRadius: 2,
        pointHoverRadius: 5,
        pointHitRadius: 12,
        tension: 0.25,
        spanGaps: false
      };
    });

    new Chart(document.getElementById("graficoCantidadPorMes"), {
      type: "line",
      data: { labels: meses, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          title: {
            display: true,
            text: "Cantidad mensual por año"
          },
          legend: {
            position: "bottom",
            labels: {
              usePointStyle: true,
              pointStyle: "line",
              boxWidth: 18,
              padding: 14
            }
          },
          tooltip: {
            callbacks: {
              label: (contexto) =>
                `${contexto.dataset.label}: ${new Intl.NumberFormat("es-ES").format(contexto.parsed.y)}`
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "Meses"
            }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: "Cantidad"
            },
            ticks: {
              callback: (valor) => new Intl.NumberFormat("es-ES", { notation: "compact" }).format(valor)
            }
          }
        }
      }
    });
  })();
</script>
