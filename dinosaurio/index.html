<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PIXEL REX</title>


  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    body {

      background: #111;

      display: flex;

      align-items: center;
      justify-content: center;

      font-family:
        "Courier New",
        monospace;

      user-select: none;

      -webkit-user-select: none;

      touch-action: none;

    }


    .game-wrapper {

      width:
        min(1200px,
          96vw);

    }


    .title {

      color: #fff;

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      letter-spacing: 6px;

      margin-bottom: 8px;

    }


    .game-frame {

      width: 100%;

      background: #fff;

      border: 4px solid #fff;

      overflow: hidden;

    }


    canvas {

      display: block;

      width: 100%;

      height: auto;

      background: #fff;

      image-rendering: pixelated;

      image-rendering: crisp-edges;

      cursor: pointer;

    }


    .instructions {

      margin-top: 8px;

      text-align: center;

      color: #999;

      font-size: 11px;

    }


    .key {

      display: inline-block;

      padding:
        2px 6px;

      background: #fff;

      color: #111;

      font-weight: bold;

    }
  </style>

</head>


<body>


  <div class="game-wrapper">


    <div class="title">
      PIXEL REX
    </div>


    <div class="game-frame">

      <canvas id="game" width="1200" height="520"></canvas>

    </div>


    <div class="instructions">

      <span class="key">
        ESPACIO
      </span>

      /

      <span class="key">
        ↑
      </span>

      SALTAR

      &nbsp;&nbsp;

      <span class="key">
        ↓
      </span>

      AGACHARSE

      &nbsp;&nbsp;

      <span class="key">
        ENTER
      </span>

      REINICIAR

    </div>

  </div>



  <script>

    /* =========================================================
       PIXEL REX
       =========================================================
    
       Juego completo en un único HTML.
    
       NO necesita:
       - imágenes
       - SVG
       - assets
       - librerías
       - servidor
    
       ========================================================= */


    /* =========================================================
       CANVAS
    ========================================================= */

    const canvas =
      document.getElementById(
        "game"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.imageSmoothingEnabled =
      false;


    const WIDTH =
      canvas.width;


    const HEIGHT =
      canvas.height;


    /* =========================================================
       SUELO
    ========================================================= */

    const GROUND =
      390;


    /* =========================================================
       DEBUG
    =========================================================
    
       Cambia a true si quieres ver
       las cajas de colisión.
    
       VERDE = dinosaurio
       ROJO  = obstáculo
    ========================================================= */

    const DEBUG =
      false;


    /* =========================================================
       EMOJIS
    ========================================================= */

    const EMOJI = {

      rex:
        "🦖",

      bird:
        "🐦",

      cactus:
        "🌵"

    };


    /* =========================================================
       JUGADOR
    ========================================================= */

    const player = {

      x:
        150,

      y:
        GROUND,

      width:
        64,

      height:
        70,

      velocityY:
        0,

      jumping:
        false,

      crouching:
        false,

      animation:
        0

    };


    /* =========================================================
       FÍSICA
    ========================================================= */

    const GRAVITY =
      1800;


    /*
       Fuerza inicial del salto.
    
       Lo suficientemente grande para superar
       cactus y pájaros altos.
    */

    const JUMP_FORCE =
      -820;


    /* =========================================================
       VELOCIDAD
    ========================================================= */

    let speed =
      285;


    const MAX_SPEED =
      420;


    /* =========================================================
       JUEGO
    ========================================================= */

    let running =
      true;


    let score =
      0;


    let best =
      Number(
        localStorage.getItem(
          "pixelRexBest"
        )
      ) || 0;


    /* =========================================================
       OBSTÁCULOS
    ========================================================= */

    let obstacles =
      [];


    let spawnTimer =
      0;


    let spawnDelay =
      1.8;


    /* =========================================================
       DECORACIÓN
    ========================================================= */

    let worldOffset =
      0;


    /* =========================================================
       INPUT
    ========================================================= */

    const keys = {

      down:
        false

    };


    /*
       Importante:
    
       Usamos keydown directamente.
    
       No esperamos ningún evento de animación
       para cambiar el estado del jugador.
    */

    document.addEventListener(
      "keydown",
      handleKeyDown
    );


    document.addEventListener(
      "keyup",
      handleKeyUp
    );


    /* =========================================================
       KEYDOWN
    ========================================================= */

    function handleKeyDown(
      event
    ) {

      /*
         Evitar que las flechas
         hagan scroll en la página.
      */

      if (

        event.code ===
        "ArrowUp"

        ||

        event.code ===
        "ArrowDown"

        ||

        event.code ===
        "Space"

      ) {

        event.preventDefault();

      }


      /*
         SALTO
      */

      if (

        (
          event.code ===
          "Space"

          ||

          event.code ===
          "ArrowUp"
        )

        &&

        !event.repeat

      ) {

        jump();

      }


      /*
         AGACHARSE
  
         El cambio es inmediato.
      */

      if (

        event.code ===
        "ArrowDown"

        ||

        event.code ===
        "KeyS"

      ) {

        keys.down =
          true;

      }


      /*
         REINICIAR
      */

      if (

        event.code ===
        "Enter"

        &&

        !running

      ) {

        resetGame();

      }

    }


    /* =========================================================
       KEYUP
    ========================================================= */

    function handleKeyUp(
      event
    ) {

      if (

        event.code ===
        "ArrowDown"

        ||

        event.code ===
        "KeyS"

      ) {

        keys.down =
          false;

      }

    }


    /* =========================================================
       SALTO
    ========================================================= */

    function jump() {

      if (
        !running
      ) {

        return;

      }


      if (
        player.jumping
      ) {

        return;

      }


      player.jumping =
        true;


      player.crouching =
        false;


      player.velocityY =
        JUMP_FORCE;

    }


    /* =========================================================
       HITBOX DEL JUGADOR
    ========================================================= */

    function getPlayerHitbox() {


      /*
         =====================================================
         DE PIE
         =====================================================
      */

      if (
        !player.crouching
      ) {

        return {

          x:
            player.x + 17,

          y:
            player.y - 61,

          width:
            43,

          height:
            57

        };

      }


      /*
         =====================================================
         AGACHADO
         =====================================================
  
         El cuerpo ocupa una zona mucho más baja.
      */

      return {

        x:
          player.x + 10,

        y:
          player.y - 39,

        width:
          53,

        height:
          35

      };

    }


    /* =========================================================
       HITBOX DE OBSTÁCULOS
    ========================================================= */

    function getObstacleHitbox(
      obstacle
    ) {


      /*
         =====================================================
         CACTUS
         =====================================================
      */

      if (
        obstacle.type ===
        "cactus"
      ) {

        return {

          x:
            obstacle.x + 13,

          y:
            obstacle.y -
            obstacle.height +
            8,

          width:
            obstacle.width - 26,

          height:
            obstacle.height - 10

        };

      }


      /*
         =====================================================
         PÁJARO
         =====================================================
  
         El pájaro tiene una hitbox central.
  
         La posición depende de su altura.
      */

      return {

        x:
          obstacle.x + 8,

        y:
          obstacle.y - 23,

        width:
          obstacle.width - 16,

        height:
          25

      };

    }


    /* =========================================================
       COLISIÓN AABB
    ========================================================= */

    function collision(
      a,
      b
    ) {

      return (

        a.x <
        b.x + b.width

        &&

        a.x + a.width >
        b.x

        &&

        a.y <
        b.y + b.height

        &&

        a.y + a.height >
        b.y

      );

    }


    /* =========================================================
       CREAR CACTUS
    ========================================================= */

    function createCactus() {

      const large =
        Math.random() <
        0.35;


      const height =
        large
          ? 88
          : 68;


      const width =
        large
          ? 58
          : 48;


      obstacles.push({

        type:
          "cactus",

        x:
          WIDTH + 80,

        y:
          GROUND,

        width:
          width,

        height:
          height,

        passed:
          false

      });

    }


    /* =========================================================
       CREAR PÁJARO
    ========================================================= */

    function createBird() {


      /*
         50% pájaro bajo
         50% pájaro alto
      */

      const low =
        Math.random() <
        0.5;


      obstacles.push({

        type:
          "bird",

        x:
          WIDTH + 80,


        /*
           ==================================================
           PÁJARO BAJO
           ==================================================

           El cuerpo está a una altura
           que obliga a agacharse.
        */

        y:
          low

            ? GROUND - 48

            : GROUND - 135,


        width:
          78,

        height:
          42,

        low:
          low,

        animation:
          Math.random() * 10,

        passed:
          false

      });

    }


    /* =========================================================
       GENERAR OBSTÁCULO
    ========================================================= */

    function spawnObstacle() {


      /*
         Impedir combinaciones
         demasiado cercanas.
      */

      if (
        obstacles.length
      ) {

        const last =
          obstacles[
          obstacles.length - 1
          ];


        const distance =
          WIDTH -
          last.x;


        if (
          distance <
          420
        ) {

          return;

        }

      }


      /*
         Los pájaros aparecen
         cuando el jugador ya ha
         tenido tiempo de familiarizarse
         con los cactus.
      */

      if (

        score > 80

        &&

        Math.random() <
        0.45

      ) {

        createBird();

      }

      else {

        createCactus();

      }

    }


    /* =========================================================
       ACTUALIZAR JUGADOR
    ========================================================= */

    function updatePlayer(
      dt
    ) {


      /*
         AGACHARSE
  
         Solo puede agacharse en el suelo.
  
         Esto evita estados extraños durante
         el salto.
      */

      if (
        !player.jumping
      ) {

        player.crouching =
          keys.down;

      }

      else {

        player.crouching =
          false;

      }


      /*
         FÍSICA DEL SALTO
      */

      if (
        player.jumping
      ) {

        player.velocityY +=
          GRAVITY * dt;


        player.y +=
          player.velocityY * dt;


        /*
           SUELO
        */

        if (
          player.y >=
          GROUND
        ) {

          player.y =
            GROUND;


          player.velocityY =
            0;


          player.jumping =
            false;

        }

      }


      /*
         ANIMACIÓN
  
         Se incrementa continuamente
         para conseguir movimiento
         aunque el jugador esté corriendo.
      */

      player.animation +=
        dt * 12;

    }


    /* =========================================================
       ACTUALIZAR OBSTÁCULOS
    ========================================================= */

    function updateObstacles(
      dt
    ) {


      for (
        let i =
          obstacles.length - 1;

        i >= 0;

        i--
      ) {


        const obstacle =
          obstacles[i];


        /*
           MOVIMIENTO
        */

        obstacle.x -=
          speed * dt;


        /*
           ANIMACIÓN DEL PÁJARO
        */

        if (
          obstacle.type ===
          "bird"
        ) {

          obstacle.animation +=
            dt * 14;

        }


        /*
           HITBOXES

           Se calculan de nuevo cada frame.
        */

        const playerBox =
          getPlayerHitbox();


        const obstacleBox =
          getObstacleHitbox(
            obstacle
          );


        /*
           COLISIÓN
        */

        if (
          collision(
            playerBox,
            obstacleBox
          )
        ) {

          gameOver();

          return;

        }


        /*
           PUNTOS
        */

        if (

          !obstacle.passed

          &&

          obstacle.x +
          obstacle.width <
          player.x

        ) {

          obstacle.passed =
            true;


          score +=
            10;

        }


        /*
           ELIMINAR
        */

        if (

          obstacle.x +
          obstacle.width <
          -100

        ) {

          obstacles.splice(
            i,
            1
          );

        }

      }

    }


    /* =========================================================
       DIFICULTAD
    ========================================================= */

    function updateDifficulty(
      dt
    ) {

      /*
         Incremento muy progresivo.
  
         Evitamos que el juego se vuelva
         imposible demasiado pronto.
      */

      speed +=
        2.5 * dt;


      speed =
        Math.min(
          speed,
          MAX_SPEED
        );

    }


    /* =========================================================
       FONDO
    ========================================================= */

    function drawBackground(
      time
    ) {


      /*
         BLANCO
      */

      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
      );


      /*
         =====================================================
         NUBES
         =====================================================
      */

      drawCloud(
        180 -
        ((time * 0.018) % 1400),

        85
      );


      drawCloud(
        650 -
        ((time * 0.012) % 1400),

        125
      );


      drawCloud(
        1100 -
        ((time * 0.015) % 1400),

        65
      );


      /*
         =====================================================
         MONTAÑAS
         =====================================================
      */

      ctx.fillStyle =
        "#e5e5e5";


      drawMountain(
        40,
        315,
        240,
        75
      );


      drawMountain(
        360,
        335,
        190,
        55
      );


      drawMountain(
        650,
        300,
        260,
        90
      );


      drawMountain(
        1010,
        325,
        210,
        65
      );


      /*
         =====================================================
         SUELO
         =====================================================
      */

      ctx.fillStyle =
        "#111111";


      ctx.fillRect(
        0,
        GROUND,
        WIDTH,
        3
      );


      /*
         =====================================================
         MARCAS DEL SUELO
         =====================================================
      */

      worldOffset +=
        speed * 0.016;


      const offset =
        worldOffset % 100;


      for (
        let x =
          -offset;

        x <
        WIDTH + 100;

        x += 100
      ) {

        ctx.fillRect(
          x,
          GROUND + 23,
          42,
          2
        );

      }

    }


    /* =========================================================
       NUBES
    ========================================================= */

    function drawCloud(
      x,
      y
    ) {

      ctx.strokeStyle =
        "#111111";


      ctx.lineWidth =
        3;


      ctx.beginPath();


      ctx.moveTo(
        x,
        y + 12
      );


      ctx.lineTo(
        x + 15,
        y + 12
      );


      ctx.lineTo(
        x + 20,
        y + 4
      );


      ctx.lineTo(
        x + 35,
        y + 4
      );


      ctx.lineTo(
        x + 42,
        y - 3
      );


      ctx.lineTo(
        x + 57,
        y - 3
      );


      ctx.lineTo(
        x + 66,
        y + 5
      );


      ctx.lineTo(
        x + 82,
        y + 5
      );


      ctx.lineTo(
        x + 88,
        y + 12
      );


      ctx.lineTo(
        x,
        y + 12
      );


      ctx.stroke();

    }


    /* =========================================================
       MONTAÑA
    ========================================================= */

    function drawMountain(
      x,
      y,
      width,
      height
    ) {

      ctx.beginPath();


      ctx.moveTo(
        x,
        GROUND
      );


      ctx.lineTo(
        x + width * 0.45,
        y
      );


      ctx.lineTo(
        x + width * 0.55,
        y + height * 0.25
      );


      ctx.lineTo(
        x + width,
        GROUND
      );


      ctx.closePath();


      ctx.fill();

    }


    /* =========================================================
       DIBUJAR REX
    ========================================================= */

    function drawRex(
      time
    ) {


      /*
         =====================================================
         REX AGACHADO
         =====================================================
      */

      if (
        player.crouching
      ) {

        ctx.save();


        /*
           Emoji horizontal.

           Lo hacemos más ancho y bajo
           para representar la postura.
        */

        ctx.font =
          "58px Arial";


        ctx.textAlign =
          "left";


        ctx.textBaseline =
          "bottom";


        /*
           Ligera animación.
        */

        const frame =
          Math.floor(
            player.animation
          ) % 2;


        const bob =
          frame === 0
            ? 0
            : 1;


        ctx.fillText(

          EMOJI.rex,

          player.x - 12,

          player.y -
          2 +
          bob

        );


        ctx.restore();


      }

      else {


        /*
           =================================================
           REX NORMAL
           =================================================
        */

        ctx.save();


        ctx.font =
          "62px Arial";


        ctx.textAlign =
          "left";


        ctx.textBaseline =
          "bottom";


        /*
           Animación de carrera.

           El pequeño desplazamiento vertical
           hace que no parezca completamente estático.
        */

        const frame =
          Math.floor(
            player.animation
          ) % 2;


        const bob =
          frame === 0
            ? 0
            : 2;


        ctx.fillText(

          EMOJI.rex,

          player.x - 12,

          player.y -
          1 +
          bob

        );


        ctx.restore();

      }


      /*
         DEBUG
      */

      if (
        DEBUG
      ) {

        const box =
          getPlayerHitbox();


        ctx.strokeStyle =
          "#00aa00";


        ctx.lineWidth =
          2;


        ctx.strokeRect(

          box.x,
          box.y,
          box.width,
          box.height

        );

      }

    }


    /* =========================================================
       DIBUJAR CACTUS
    ========================================================= */

    function drawCactus(
      obstacle
    ) {


      ctx.save();


      ctx.font =
        obstacle.height >
          80
          ? "78px Arial"
          : "64px Arial";


      ctx.textAlign =
        "left";


      ctx.textBaseline =
        "bottom";


      ctx.fillText(

        EMOJI.cactus,

        obstacle.x - 8,

        obstacle.y + 2

      );


      ctx.restore();


      /*
         DEBUG
      */

      if (
        DEBUG
      ) {

        const box =
          getObstacleHitbox(
            obstacle
          );


        ctx.strokeStyle =
          "#ff0000";


        ctx.lineWidth =
          2;


        ctx.strokeRect(

          box.x,
          box.y,
          box.width,
          box.height

        );

      }

    }


    /* =========================================================
       DIBUJAR PÁJARO
    ========================================================= */

    function drawBird(
      obstacle
    ) {


      ctx.save();


      /*
         =====================================================
         ANIMACIÓN DE VUELO
         =====================================================
      */

      const frame =
        Math.floor(
          obstacle.animation
        ) % 3;


      let rotation;


      if (
        frame === 0
      ) {

        rotation =
          -0.10;

      }

      else if (
        frame === 1
      ) {

        rotation =
          0.08;

      }

      else {

        rotation =
          -0.04;

      }


      /*
         =====================================================
         DIBUJO
         =====================================================
      */

      ctx.translate(

        obstacle.x +
        obstacle.width / 2,

        obstacle.y

      );


      ctx.rotate(
        rotation
      );


      ctx.font =
        "43px Arial";


      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "middle";


      ctx.fillText(
        EMOJI.bird,
        0,
        0
      );


      ctx.restore();


      /*
         DEBUG
      */

      if (
        DEBUG
      ) {

        const box =
          getObstacleHitbox(
            obstacle
          );


        ctx.strokeStyle =
          "#ff0000";


        ctx.lineWidth =
          2;


        ctx.strokeRect(

          box.x,
          box.y,
          box.width,
          box.height

        );

      }

    }


    /* =========================================================
       DIBUJAR OBSTÁCULOS
    ========================================================= */

    function drawObstacles() {


      for (
        const obstacle
        of obstacles
      ) {


        if (
          obstacle.type ===
          "cactus"
        ) {

          drawCactus(
            obstacle
          );

        }

        else {

          drawBird(
            obstacle
          );

        }

      }

    }


    /* =========================================================
       HUD
    ========================================================= */

    function drawHUD() {


      ctx.fillStyle =
        "#111111";


      ctx.font =
        "bold 15px Courier New";


      ctx.textAlign =
        "left";


      ctx.fillText(

        "SCORE " +

        String(
          Math.floor(
            score
          )
        ).padStart(
          5,
          "0"
        ),

        25,
        30

      );


      ctx.fillText(

        "BEST " +

        String(
          best
        ).padStart(
          5,
          "0"
        ),

        170,
        30

      );

    }


    /* =========================================================
       GAME OVER
    ========================================================= */

    function gameOver() {


      running =
        false;


      best =
        Math.max(

          best,

          Math.floor(
            score
          )

        );


      localStorage.setItem(

        "pixelRexBest",

        best

      );

    }


    /* =========================================================
       PANTALLA GAME OVER
    ========================================================= */

    function drawGameOver() {


      ctx.fillStyle =
        "rgba(255,255,255,0.94)";


      ctx.fillRect(

        0,
        0,
        WIDTH,
        HEIGHT

      );


      ctx.fillStyle =
        "#111111";


      ctx.textAlign =
        "center";


      ctx.font =
        "bold 46px Courier New";


      ctx.fillText(

        "GAME OVER",

        WIDTH / 2,

        215

      );


      ctx.font =
        "bold 18px Courier New";


      ctx.fillText(

        "SCORE " +

        String(
          Math.floor(
            score
          )
        ).padStart(
          5,
          "0"
        ),

        WIDTH / 2,

        255

      );


      ctx.font =
        "bold 14px Courier New";


      ctx.fillText(

        "PULSA ENTER PARA REINICIAR",

        WIDTH / 2,

        295

      );


      ctx.textAlign =
        "left";

    }


    /* =========================================================
       REINICIAR
    ========================================================= */

    function resetGame() {


      obstacles =
        [];


      score =
        0;


      speed =
        285;


      spawnTimer =
        0;


      spawnDelay =
        1.8;


      worldOffset =
        0;


      player.x =
        150;


      player.y =
        GROUND;


      player.velocityY =
        0;


      player.jumping =
        false;


      player.crouching =
        false;


      player.animation =
        0;


      keys.down =
        false;


      running =
        true;


      lastTime =
        performance.now();

    }


    /* =========================================================
       LOOP PRINCIPAL
    ========================================================= */

    let lastTime =
      performance.now();


    function gameLoop(
      timestamp
    ) {


      /*
         Delta time.
      */

      let dt =
        (
          timestamp -
          lastTime
        ) / 1000;


      /*
         Evita saltos físicos enormes
         si el navegador se bloquea.
      */

      dt =
        Math.min(
          dt,
          0.025
        );


      lastTime =
        timestamp;


      /*
         =====================================================
         ACTUALIZACIÓN
         =====================================================
      */

      if (
        running
      ) {


        updatePlayer(
          dt
        );


        updateObstacles(
          dt
        );


        updateDifficulty(
          dt
        );


        /*
           GENERACIÓN
        */

        spawnTimer +=
          dt;


        if (
          spawnTimer >=
          spawnDelay
        ) {

          spawnTimer =
            0;


          spawnObstacle();


          /*
             Espaciado aleatorio.

             No demasiado corto para que
             siempre exista tiempo de reacción.
          */

          spawnDelay =
            1.55 +
            Math.random() *
            0.8;

        }


        /*
           PUNTUACIÓN
        */

        score +=
          dt * 7;

      }


      /*
         =====================================================
         RENDER
         =====================================================
      */

      drawBackground(
        timestamp
      );


      drawObstacles();


      drawRex(
        timestamp
      );


      drawHUD();


      /*
         GAME OVER
      */

      if (
        !running
      ) {

        drawGameOver();

      }


      requestAnimationFrame(
        gameLoop
      );

    }


    /* =========================================================
       INICIAR
    ========================================================= */

    requestAnimationFrame(
      gameLoop
    );

  </script>

</body>
