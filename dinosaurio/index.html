<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PIXEL REX</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #182218;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Courier New", monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    .game-wrapper {
      width: min(1200px, 96vw);
    }

    .title {
      color: #ffffff;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 6px;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 #000000;
    }

    .game-frame {
      width: 100%;
      background: #dceef4;
      border: 4px solid #ffffff;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #dceef4;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: pointer;
    }

    .instructions {
      margin-top: 8px;
      text-align: center;
      color: #bbbbbb;
      font-size: 11px;
    }

    .key {
      display: inline-block;
      padding: 2px 6px;
      background: #ffffff;
      color: #111111;
      font-weight: bold;
      border-radius: 2px;
    }
  </style>

</head>

<body>

  <div class="game-wrapper">

    <div class="title">
      PIXEL REX
    </div>

    <div class="game-frame">

      <canvas id="game" width="1200" height="520">
      </canvas>

    </div>

    <div class="instructions">

      <span class="key">ESPACIO</span>
      /
      <span class="key">↑</span>
      SALTAR

      &nbsp;&nbsp;

      <span class="key">↓</span>
      AGACHARSE

      &nbsp;&nbsp;

      <span class="key">ENTER</span>
      REINICIAR

    </div>

  </div>

  <script>

    const canvas =
      document.getElementById("game");

    const ctx =
      canvas.getContext("2d");

    ctx.imageSmoothingEnabled = false;

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    const GROUND = 390;

    const DEBUG = false;


    const EMOJI = {

      rex: "🦖",

      bird: "🐦",

      cactus: "🌵",

      tree: "🌴",

      bush: "🌿",

      rock: "🪨",

      flower: "🌼",

      flower2: "🌻",

      grass: "🌱",

      mushroom: "🍄",

      cloud: "☁️",

      mountain: "⛰️"

    };


    const player = {

      x: 150,

      y: GROUND,

      width: 64,

      height: 70,

      velocityY: 0,

      jumping: false,

      crouching: false,

      animation: 0

    };


    const GRAVITY = 1800;

    const JUMP_FORCE = -820;

    let speed = 285;

    const MAX_SPEED = 440;

    let running = true;

    let score = 0;

    let best =
      Number(
        localStorage.getItem("pixelRexBest")
      ) || 0;


    let obstacles = [];

    let spawnTimer = 0;

    let spawnDelay = 1.65;

    let worldOffset = 0;


    const keys = {

      down: false

    };


    document.addEventListener(
      "keydown",
      handleKeyDown
    );

    document.addEventListener(
      "keyup",
      handleKeyUp
    );


    function handleKeyDown(event) {

      if (

        event.code === "ArrowUp" ||

        event.code === "ArrowDown" ||

        event.code === "Space"

      ) {

        event.preventDefault();

      }


      if (

        (

          event.code === "Space" ||

          event.code === "ArrowUp"

        )

        &&

        !event.repeat

      ) {

        jump();

      }


      if (

        event.code === "ArrowDown" ||

        event.code === "KeyS"

      ) {

        keys.down = true;

      }


      if (

        event.code === "Enter" &&

        !running

      ) {

        resetGame();

      }

    }


    function handleKeyUp(event) {

      if (

        event.code === "ArrowDown" ||

        event.code === "KeyS"

      ) {

        keys.down = false;

      }

    }


    function jump() {

      if (!running) {
        return;
      }

      if (player.jumping) {
        return;
      }

      player.jumping = true;

      player.crouching = false;

      player.velocityY = JUMP_FORCE;

    }


    function getPlayerHitbox() {

      if (!player.crouching) {

        return {

          x: player.x + 18,

          y: player.y - 61,

          width: 40,

          height: 57

        };

      }


      return {

        x: player.x + 8,

        y: player.y - 37,

        width: 54,

        height: 33

      };

    }


    function getObstacleHitbox(obstacle) {

      if (
        obstacle.type === "cactus"
      ) {

        return {

          x:
            obstacle.x +
            obstacle.hitbox.x,

          y:
            obstacle.y -
            obstacle.height +
            obstacle.hitbox.y,

          width:
            obstacle.hitbox.width,

          height:
            obstacle.hitbox.height

        };

      }


      return {

        x:
          obstacle.x +
          obstacle.hitbox.x,

        y:
          obstacle.y +
          obstacle.hitbox.y,

        width:
          obstacle.hitbox.width,

        height:
          obstacle.hitbox.height

      };

    }


    function collision(a, b) {

      return (

        a.x <
        b.x + b.width &&

        a.x + a.width >
        b.x &&

        a.y <
        b.y + b.height &&

        a.y + a.height >
        b.y

      );

    }


    function createCactus() {

      const type =
        Math.floor(
          Math.random() * 4
        );


      let width;
      let height;
      let fontSize;
      let hitbox;


      if (type === 0) {

        width = 45;
        height = 60;
        fontSize = 58;

        hitbox = {

          x: 11,
          y: 8,
          width: 23,
          height: 48

        };

      }


      else if (type === 1) {

        width = 52;
        height = 78;
        fontSize = 70;

        hitbox = {

          x: 12,
          y: 8,
          width: 28,
          height: 65

        };

      }


      else if (type === 2) {

        width = 62;
        height = 98;
        fontSize = 86;

        hitbox = {

          x: 13,
          y: 8,
          width: 36,
          height: 82

        };

      }


      else {

        width = 78;
        height = 72;
        fontSize = 68;

        hitbox = {

          x: 10,
          y: 10,
          width: 58,
          height: 57

        };

      }


      obstacles.push({

        type: "cactus",

        variant: type,

        x: WIDTH + 80,

        y: GROUND,

        width: width,

        height: height,

        fontSize: fontSize,

        hitbox: hitbox,

        passed: false

      });

    }


    function createBird() {

      const type =
        Math.floor(
          Math.random() * 5
        );


      let y;
      let width;
      let height;
      let fontSize;
      let hitbox;
      let mode;


      /*
        PÁJARO DE SALTO
      */

      if (type === 0) {

        mode = "jump";

        y = GROUND - 22;

        width = 70;

        height = 40;

        fontSize = 42;

        hitbox = {

          x: 10,
          y: -17,
          width: 50,
          height: 27

        };

      }


      /*
        PÁJARO DE SALTO GRANDE
      */

      else if (type === 1) {

        mode = "jump";

        y = GROUND - 28;

        width = 88;

        height = 50;

        fontSize = 52;

        hitbox = {

          x: 9,
          y: -23,
          width: 68,
          height: 34

        };

      }


      /*
        PÁJARO ALTO PEQUEÑO
      */

      else if (type === 2) {

        mode = "crouch";

        y = GROUND - 64;

        width = 72;

        height = 40;

        fontSize = 42;

        hitbox = {

          x: 8,
          y: -20,
          width: 56,
          height: 27

        };

      }


      /*
        PÁJARO ALTO GRANDE
      */

      else if (type === 3) {

        mode = "crouch";

        y = GROUND - 70;

        width = 96;

        height = 50;

        fontSize = 54;

        hitbox = {

          x: 7,
          y: -25,
          width: 82,
          height: 35

        };

      }


      /*
        PÁJARO ALTO MUY ANCHO
      */

      else {

        mode = "crouch";

        y = GROUND - 62;

        width = 112;

        height = 52;

        fontSize = 58;

        hitbox = {

          x: 5,
          y: -26,
          width: 100,
          height: 36

        };

      }


      obstacles.push({

        type: "bird",

        mode: mode,

        x: WIDTH + 80,

        y: y,

        width: width,

        height: height,

        fontSize: fontSize,

        hitbox: hitbox,

        animation:
          Math.random() * 10,

        passed: false

      });

    }


    function spawnObstacle() {

      if (obstacles.length) {

        const last =
          obstacles[
          obstacles.length - 1
          ];


        const distance =
          WIDTH - last.x;


        if (distance < 400) {

          return;

        }

      }


      /*
        Aumentamos progresivamente
        la variedad.
      */

      let birdChance =
        0.30;


      if (score > 100) {
        birdChance = 0.45;
      }

      if (score > 250) {
        birdChance = 0.55;
      }

      if (score > 450) {
        birdChance = 0.62;
      }


      if (
        Math.random() <
        birdChance
      ) {

        createBird();

      } else {

        createCactus();

      }

    }


    function updatePlayer(dt) {

      if (!player.jumping) {

        player.crouching =
          keys.down;

      } else {

        player.crouching =
          false;

      }


      if (player.jumping) {

        player.velocityY +=
          GRAVITY * dt;

        player.y +=
          player.velocityY * dt;


        if (
          player.y >= GROUND
        ) {

          player.y = GROUND;

          player.velocityY = 0;

          player.jumping = false;

        }

      }


      player.animation +=
        dt * 12;

    }


    function updateObstacles(dt) {

      for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
      ) {

        const obstacle =
          obstacles[i];


        obstacle.x -=
          speed * dt;


        if (
          obstacle.type === "bird"
        ) {

          obstacle.animation +=
            dt * 14;

        }


        const playerBox =
          getPlayerHitbox();


        const obstacleBox =
          getObstacleHitbox(
            obstacle
          );


        if (
          collision(
            playerBox,
            obstacleBox
          )
        ) {

          gameOver();

          return;

        }


        if (

          !obstacle.passed &&

          obstacle.x +
          obstacle.width <
          player.x

        ) {

          obstacle.passed = true;

          score += 10;

        }


        if (

          obstacle.x +
          obstacle.width <
          -120

        ) {

          obstacles.splice(
            i,
            1
          );

        }

      }

    }


    function updateDifficulty(dt) {

      speed +=
        2.6 * dt;


      speed =
        Math.min(
          speed,
          MAX_SPEED
        );

    }


    function drawBackground(time) {

      /*
        CIELO
      */

      const sky =
        ctx.createLinearGradient(
          0,
          0,
          0,
          GROUND
        );


      sky.addColorStop(
        0,
        "#78c5df"
      );


      sky.addColorStop(
        1,
        "#d5e8df"
      );


      ctx.fillStyle =
        sky;


      ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
      );


      /*
        SOL
      */

      ctx.save();

      ctx.font =
        "72px Arial";

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.globalAlpha =
        0.75;

      ctx.fillText(
        "☀️",
        1050,
        90
      );

      ctx.restore();


      /*
        NUBES
      */

      drawCloud(
        150 -
        ((time * 0.012) % 1450),
        75,
        1
      );


      drawCloud(
        600 -
        ((time * 0.009) % 1550),
        120,
        0.8
      );


      drawCloud(
        1050 -
        ((time * 0.015) % 1650),
        55,
        1.1
      );


      /*
        CAPA DE MONTAÑAS LEJANAS
      */

      drawFarMountains();


      /*
        CAPA DE MONTAÑAS CERCANAS
      */

      drawNearMountains();


      /*
        DECORACIÓN
      */

      drawBackgroundObjects();


      /*
        SUELO
      */

      ctx.fillStyle =
        "#a9c58c";


      ctx.fillRect(
        0,
        GROUND,
        WIDTH,
        HEIGHT - GROUND
      );


      /*
        BORDE DEL SUELO
      */

      ctx.fillStyle =
        "#6d9164";


      ctx.fillRect(
        0,
        GROUND,
        WIDTH,
        9
      );


      ctx.fillStyle =
        "#536f50";


      ctx.fillRect(
        0,
        GROUND + 9,
        WIDTH,
        3
      );


      /*
        TEXTURA
      */

      worldOffset +=
        speed * 0.016;


      const offset =
        worldOffset % 85;


      ctx.fillStyle =
        "#7d9f6d";


      for (
        let x = -offset;
        x < WIDTH + 100;
        x += 85
      ) {

        ctx.fillRect(
          x,
          GROUND + 28,
          35,
          4
        );


        ctx.fillRect(
          x + 48,
          GROUND + 58,
          18,
          3
        );

      }

    }


    function drawCloud(
      x,
      y,
      scale
    ) {

      ctx.save();

      ctx.translate(
        x,
        y
      );

      ctx.scale(
        scale,
        scale
      );

      ctx.font =
        "54px Arial";

      ctx.textAlign =
        "center";

      ctx.textBaseline =
        "middle";

      ctx.globalAlpha =
        0.65;

      ctx.fillText(
        "☁️",
        0,
        0
      );

      ctx.restore();

    }


    function drawFarMountains() {

      ctx.fillStyle =
        "#9ab7a2";


      drawMountain(
        -50,
        310,
        330,
        90
      );


      drawMountain(
        200,
        325,
        300,
        65
      );


      drawMountain(
        470,
        300,
        360,
        90
      );


      drawMountain(
        800,
        315,
        340,
        75
      );


      drawMountain(
        1050,
        300,
        300,
        90
      );

    }


    function drawNearMountains() {

      ctx.fillStyle =
        "#7f9f83";


      drawMountain(
        -100,
        345,
        300,
        45
      );


      drawMountain(
        180,
        338,
        280,
        52
      );


      drawMountain(
        500,
        335,
        310,
        55
      );


      drawMountain(
        850,
        340,
        300,
        50
      );

    }


    function drawMountain(
      x,
      y,
      width,
      height
    ) {

      ctx.beginPath();

      ctx.moveTo(
        x,
        GROUND
      );


      ctx.lineTo(
        x + width * 0.45,
        y
      );


      ctx.lineTo(
        x + width * 0.55,
        y +
        height * 0.25
      );


      ctx.lineTo(
        x + width,
        GROUND
      );


      ctx.closePath();

      ctx.fill();

    }


    function drawBackgroundObjects() {

      const offset =
        (worldOffset * 0.35) % 600;


      for (
        let x = -offset;
        x < WIDTH + 600;
        x += 600
      ) {

        ctx.save();


        ctx.textAlign =
          "center";

        ctx.textBaseline =
          "bottom";


        /*
          ÁRBOLES
        */

        ctx.globalAlpha =
          0.55;


        ctx.font =
          "58px Arial";


        ctx.fillText(
          EMOJI.tree,
          x + 80,
          GROUND + 5
        );


        ctx.font =
          "42px Arial";


        ctx.fillText(
          EMOJI.tree,
          x + 350,
          GROUND + 5
        );


        /*
          ROCAS
        */

        ctx.font =
          "34px Arial";


        ctx.fillText(
          EMOJI.rock,
          x + 180,
          GROUND + 5
        );


        ctx.fillText(
          EMOJI.rock,
          x + 470,
          GROUND + 5
        );


        /*
          ARBUSTOS
        */

        ctx.font =
          "32px Arial";


        ctx.fillText(
          EMOJI.bush,
          x + 250,
          GROUND + 5
        );


        ctx.fillText(
          EMOJI.bush,
          x + 520,
          GROUND + 5
        );


        /*
          FLORES
        */

        ctx.font =
          "24px Arial";


        ctx.fillText(
          EMOJI.flower,
          x + 300,
          GROUND + 4
        );


        ctx.fillText(
          EMOJI.flower2,
          x + 410,
          GROUND + 4
        );


        /*
          HIERBA
        */

        ctx.font =
          "22px Arial";


        ctx.fillText(
          EMOJI.grass,
          x + 130,
          GROUND + 4
        );


        ctx.fillText(
          EMOJI.grass,
          x + 390,
          GROUND + 4
        );


        /*
          SETAS
        */

        ctx.font =
          "25px Arial";


        ctx.fillText(
          EMOJI.mushroom,
          x + 560,
          GROUND + 5
        );


        ctx.restore();

      }

    }


    function drawRex() {

      ctx.save();


      const frame =
        Math.floor(
          player.animation
        ) % 2;


      const bob =
        frame === 0
          ? 0
          : 2;


      /*
        REX AGACHADO
      */

      if (player.crouching) {

        ctx.translate(
          player.x + 32,
          player.y - 2 + bob
        );


        ctx.scale(
          -1.35,
          0.68
        );


        ctx.font =
          "62px Arial";


        ctx.textAlign =
          "center";


        ctx.textBaseline =
          "bottom";


        ctx.fillText(
          EMOJI.rex,
          0,
          0
        );

      }


      /*
        REX DE PIE
      */

      else {

        const tilt =
          frame === 0
            ? -0.025
            : 0.025;


        ctx.translate(
          player.x + 30,
          player.y - 1 + bob
        );


        ctx.rotate(
          tilt
        );


        /*
          VOLTEAMOS EL EMOJI

          Ahora mira hacia la derecha.
        */

        ctx.scale(
          -1,
          1
        );


        ctx.font =
          "64px Arial";


        ctx.textAlign =
          "center";


        ctx.textBaseline =
          "bottom";


        ctx.fillText(
          EMOJI.rex,
          0,
          0
        );

      }


      ctx.restore();


      if (DEBUG) {

        const box =
          getPlayerHitbox();


        ctx.strokeStyle =
          "#00aa00";


        ctx.lineWidth = 2;


        ctx.strokeRect(
          box.x,
          box.y,
          box.width,
          box.height
        );

      }

    }


    function drawCactus(obstacle) {

      ctx.save();


      /*
        Los cactus reciben
        un pequeño halo cálido
        para que destaquen.
      */

      const centerX =
        obstacle.x +
        obstacle.width / 2;


      const centerY =
        obstacle.y -
        obstacle.height / 2;


      ctx.fillStyle =
        "rgba(255,218,100,0.32)";


      ctx.beginPath();


      ctx.arc(
        centerX,
        centerY,
        obstacle.width * 0.75,
        0,
        Math.PI * 2
      );


      ctx.fill();


      /*
        SOMBRA
      */

      ctx.font =
        obstacle.fontSize +
        "px Arial";


      ctx.textAlign =
        "left";


      ctx.textBaseline =
        "bottom";


      ctx.fillStyle =
        "rgba(25,55,20,0.55)";


      ctx.fillText(
        EMOJI.cactus,
        obstacle.x - 4,
        obstacle.y + 5
      );


      /*
        CACTUS
      */

      ctx.fillStyle =
        "#ffffff";


      ctx.fillText(
        EMOJI.cactus,
        obstacle.x - 8,
        obstacle.y
      );


      ctx.restore();


      if (DEBUG) {

        const box =
          getObstacleHitbox(
            obstacle
          );


        ctx.strokeStyle =
          "#ff0000";


        ctx.lineWidth = 3;


        ctx.strokeRect(
          box.x,
          box.y,
          box.width,
          box.height
        );

      }

    }


    function drawBird(obstacle) {

      ctx.save();


      const frame =
        Math.floor(
          obstacle.animation
        ) % 3;


      const rotation =
        frame === 0
          ? -0.10
          : frame === 1
            ? 0.08
            : -0.04;


      const bob =
        Math.sin(
          obstacle.animation
        ) * 2;


      ctx.translate(
        obstacle.x +
        obstacle.width / 2,

        obstacle.y +
        bob
      );


      ctx.rotate(
        rotation
      );


      /*
        SOMBRA
      */

      ctx.font =
        obstacle.fontSize +
        "px Arial";


      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "middle";


      ctx.fillStyle =
        "rgba(20,40,55,0.45)";


      ctx.fillText(
        EMOJI.bird,
        4,
        5
      );


      /*
        PÁJARO
      */

      ctx.fillStyle =
        "#ffffff";


      ctx.fillText(
        EMOJI.bird,
        0,
        0
      );


      ctx.restore();


      if (DEBUG) {

        const box =
          getObstacleHitbox(
            obstacle
          );


        ctx.strokeStyle =
          "#ff0000";


        ctx.lineWidth = 3;


        ctx.strokeRect(
          box.x,
          box.y,
          box.width,
          box.height
        );

      }

    }


    function drawObstacles() {

      for (
        const obstacle
        of obstacles
      ) {

        if (
          obstacle.type === "cactus"
        ) {

          drawCactus(
            obstacle
          );

        }

        else {

          drawBird(
            obstacle
          );

        }

      }

    }


    function drawHUD() {

      ctx.fillStyle =
        "#24452d";


      ctx.font =
        "bold 16px Courier New";


      ctx.textAlign =
        "left";


      ctx.fillText(

        "SCORE " +
        String(
          Math.floor(score)
        ).padStart(5, "0"),

        25,
        30

      );


      ctx.fillText(

        "BEST " +
        String(best)
          .padStart(5, "0"),

        170,
        30

      );

    }


    function gameOver() {

      running = false;


      best =
        Math.max(
          best,
          Math.floor(score)
        );


      localStorage.setItem(
        "pixelRexBest",
        best
      );

    }


    function drawGameOver() {

      ctx.fillStyle =
        "rgba(15,35,25,0.90)";


      ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
      );


      ctx.fillStyle =
        "#ffffff";


      ctx.textAlign =
        "center";


      ctx.font =
        "bold 46px Courier New";


      ctx.fillText(
        "GAME OVER",
        WIDTH / 2,
        215
      );


      ctx.font =
        "bold 18px Courier New";


      ctx.fillText(

        "SCORE " +
        String(
          Math.floor(score)
        ).padStart(5, "0"),

        WIDTH / 2,
        255

      );


      ctx.font =
        "bold 14px Courier New";


      ctx.fillText(
        "PULSA ENTER PARA REINICIAR",
        WIDTH / 2,
        295
      );


      ctx.textAlign =
        "left";

    }


    function resetGame() {

      obstacles = [];

      score = 0;

      speed = 285;

      spawnTimer = 0;

      spawnDelay = 1.65;

      worldOffset = 0;


      player.x = 150;

      player.y = GROUND;

      player.velocityY = 0;

      player.jumping = false;

      player.crouching = false;

      player.animation = 0;


      keys.down = false;

      running = true;

      lastTime =
        performance.now();

    }


    let lastTime =
      performance.now();


    function gameLoop(timestamp) {

      let dt =
        (
          timestamp -
          lastTime
        ) / 1000;


      dt =
        Math.min(
          dt,
          0.025
        );


      lastTime =
        timestamp;


      if (running) {

        updatePlayer(dt);

        updateObstacles(dt);

        updateDifficulty(dt);


        spawnTimer += dt;


        if (
          spawnTimer >=
          spawnDelay
        ) {

          spawnTimer = 0;

          spawnObstacle();


          spawnDelay =
            1.35 +
            Math.random() *
            0.65;

        }


        score +=
          dt * 7;

      }


      drawBackground(timestamp);

      drawObstacles();

      drawRex();

      drawHUD();


      if (!running) {

        drawGameOver();

      }


      requestAnimationFrame(
        gameLoop
      );

    }


    requestAnimationFrame(
      gameLoop
    );

  </script>

</body>
