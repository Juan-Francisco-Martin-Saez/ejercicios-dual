<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PIXEL REX</title>


  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

    }


    body {

      background: #111;

      display: flex;

      align-items: center;
      justify-content: center;

      font-family:
        "Courier New",
        monospace;

      user-select: none;

      -webkit-user-select: none;

      touch-action: none;

    }


    .game-container {

      width:
        min(1200px,
          96vw);

    }


    .title {

      color: #fff;

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      letter-spacing: 7px;

      margin-bottom: 8px;

    }


    .game-frame {

      background: #fff;

      border: 4px solid #fff;

      overflow: hidden;

    }


    canvas {

      display: block;

      width: 100%;

      height: auto;

      background: #fff;

      image-rendering: pixelated;

      image-rendering: crisp-edges;

    }


    .controls {

      color: #999;

      text-align: center;

      font-size: 11px;

      margin-top: 8px;

    }


    .key {

      background: #fff;

      color: #111;

      padding: 2px 6px;

      font-weight: bold;

    }
  </style>

</head>


<body>


  <div class="game-container">


    <div class="title">
      PIXEL REX
    </div>


    <div class="game-frame">

      <canvas id="game" width="1200" height="520"></canvas>

    </div>


    <div class="controls">

      <span class="key">
        ESPACIO
      </span>

      /

      <span class="key">
        ↑
      </span>

      SALTAR

      &nbsp;&nbsp;

      <span class="key">
        ↓
      </span>

      /

      <span class="key">
        S
      </span>

      AGACHARSE

      &nbsp;&nbsp;

      <span class="key">
        ENTER
      </span>

      REINICIAR

    </div>

  </div>



  <script>


    /* =========================================================
       CONFIGURACIÓN GENERAL
    ========================================================= */


    /*
        false = juego normal
    
        true = muestra las cajas de colisión
    
        VERDE  = dinosaurio
        ROJO   = obstáculo
    */

    const DEBUG = false;


    const canvas =
      document.getElementById(
        "game"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    ctx.imageSmoothingEnabled =
      false;


    const WIDTH = 1200;

    const HEIGHT = 520;

    const GROUND = 390;


    /* =========================================================
       ASSETS
    ========================================================= */

    const images = {};


    const assetFiles = {

      rex:
        "assets/rex-stand.svg",

      rexCrouch:
        "assets/rex-crouch.svg",

      bird:
        "assets/bird.svg",

      cactus:
        "assets/cactus.svg"

    };


    function loadImage(
      name,
      path
    ) {

      return new Promise(
        (resolve) => {

          const image =
            new Image();


          image.onload =
            () => {

              images[name] =
                image;

              resolve();

            };


          image.src =
            path;

        }
      );

    }


    Promise.all(

      Object.entries(
        assetFiles
      ).map(
        ([name, path]) =>

          loadImage(
            name,
            path
          )

      )

    ).then(
      () => {

        requestAnimationFrame(
          gameLoop
        );

      }
    );


    /* =========================================================
       JUGADOR
    ========================================================= */

    const player = {

      x: 145,

      y: GROUND,

      velocityY: 0,

      jumping: false,

      crouching: false

    };


    /* =========================================================
       FÍSICA
    ========================================================= */

    const GRAVITY =
      1750;


    const JUMP_FORCE =
      -770;


    /* =========================================================
       ESTADO DEL JUEGO
    ========================================================= */

    let obstacles = [];


    let score = 0;


    let best =
      Number(
        localStorage.getItem(
          "pixelRexBest"
        )
      ) || 0;


    let speed =
      285;


    const MAX_SPEED =
      440;


    let running =
      true;


    /* =========================================================
       GENERACIÓN
    ========================================================= */

    let spawnTimer =
      0;


    let spawnDelay =
      1.8;


    /* =========================================================
       TIEMPO
    ========================================================= */

    let lastTime =
      performance.now();


    /* =========================================================
       INPUT
    ========================================================= */

    const keys = {

      down: false

    };


    /* =========================================================
       HITBOX DEL DINOSAURIO
    ========================================================= */

    function getPlayerHitbox() {


      /*
          =====================================================
          DINOSAURIO DE PIE
          =====================================================
      */

      if (
        !player.crouching
      ) {

        return {

          x:
            player.x + 15,

          y:
            player.y - 58,

          width:
            42,

          height:
            53

        };

      }


      /*
          =====================================================
          DINOSAURIO AGACHADO
          =====================================================
  
          Más ancho y ligeramente más bajo.
  
          Esto permite que el pájaro bajo
          realmente pueda pasar por encima.
      */

      return {

        x:
          player.x + 10,

        y:
          player.y - 38,

        width:
          47,

        height:
          34

      };

    }


    /* =========================================================
       HITBOX DE LOS OBSTÁCULOS
    ========================================================= */

    function getObstacleHitbox(
      obstacle
    ) {


      /*
          =====================================================
          CACTUS
          =====================================================
      */

      if (
        obstacle.type ===
        "cactus"
      ) {

        return {

          x:
            obstacle.x + 12,

          y:
            obstacle.y -
            obstacle.height +
            7,

          width:
            obstacle.width -
            24,

          height:
            obstacle.height -
            10

        };

      }


      /*
          =====================================================
          PÁJARO
          =====================================================
  
          IMPORTANTE:
  
          La hitbox corresponde al cuerpo
          central del pájaro.
  
          No usamos todo el SVG porque las alas
          sobresalen demasiado.
      */

      return {

        x:
          obstacle.x + 16,

        y:
          obstacle.y - 39,

        width:
          72,

        height:
          28

      };

    }


    /* =========================================================
       COLISIÓN AABB
    ========================================================= */

    function intersects(
      a,
      b
    ) {

      return (

        a.x <
        b.x + b.width

        &&

        a.x + a.width >
        b.x

        &&

        a.y <
        b.y + b.height

        &&

        a.y + a.height >
        b.y

      );

    }


    /* =========================================================
       CREAR CACTUS
    ========================================================= */

    function createCactus() {

      const height =
        65 +
        Math.random() *
        30;


      obstacles.push({

        type:
          "cactus",

        x:
          WIDTH + 60,

        y:
          GROUND,

        width:
          65,

        height:
          height,

        passed:
          false

      });

    }


    /* =========================================================
       CREAR PÁJARO
    ========================================================= */

    function createBird() {


      /*
          TRUE:
  
          PÁJARO BAJO
  
          Se debe esquivar
          agachándose.
      */

      const low =
        Math.random() <
        0.5;


      obstacles.push({

        type:
          "bird",


        x:
          WIDTH + 80,


        /*
            =================================================
            DOS ALTURAS REALES
            =================================================

            BAJO:
            -------------------------------------------------
            El cuerpo del pájaro queda aproximadamente
            a la altura del cuello/cabeza del dinosaurio.

            ALTO:
            -------------------------------------------------
            Queda suficientemente elevado para obligar
            a realizar un salto.
        */

        y:
          low

            ? GROUND - 43

            : GROUND - 125,


        width:
          110,


        height:
          60,


        low:
          low,


        animation:
          Math.random() *
          Math.PI *
          2,


        passed:
          false

      });

    }


    /* =========================================================
       CREADOR DE OBSTÁCULOS
    ========================================================= */

    function spawnObstacle() {


      /*
          Evita que dos obstáculos
          aparezcan pegados.
      */

      if (
        obstacles.length > 0
      ) {

        const last =
          obstacles[
          obstacles.length - 1
          ];


        if (
          last.x >
          WIDTH - 470
        ) {

          return;

        }

      }


      const random =
        Math.random();


      /*
          Los pájaros comienzan
          después de cierto progreso.
      */

      if (

        score > 80

        &&

        random < 0.42

      ) {

        createBird();

      }

      else {

        createCactus();

      }

    }


    /* =========================================================
       ACTUALIZAR JUGADOR
    ========================================================= */

    function updatePlayer(
      dt
    ) {


      /*
          =====================================================
          AGACHARSE
          =====================================================
  
          El estado cambia INMEDIATAMENTE
          al pulsar ↓.
      */

      if (
        !player.jumping
      ) {

        player.crouching =
          keys.down;

      }

      else {

        player.crouching =
          false;

      }


      /*
          =====================================================
          SALTO
          =====================================================
      */

      if (
        player.jumping
      ) {

        player.velocityY +=
          GRAVITY * dt;


        player.y +=
          player.velocityY * dt;


        /*
            CONTACTO CON EL SUELO
        */

        if (
          player.y >=
          GROUND
        ) {

          player.y =
            GROUND;


          player.velocityY =
            0;


          player.jumping =
            false;

        }

      }

    }


    /* =========================================================
       SALTO
    ========================================================= */

    function jump() {


      if (
        !running
      ) {

        return;

      }


      if (
        player.jumping
      ) {

        return;

      }


      player.jumping =
        true;


      player.crouching =
        false;


      player.velocityY =
        JUMP_FORCE;

    }


    /* =========================================================
       ACTUALIZAR OBSTÁCULOS
    ========================================================= */

    function updateObstacles(
      dt
    ) {


      for (
        let i =
          obstacles.length - 1;

        i >= 0;

        i--
      ) {


        const obstacle =
          obstacles[i];


        /*
            MOVIMIENTO
        */

        obstacle.x -=
          speed * dt;


        /*
            ANIMACIÓN DEL PÁJARO
        */

        if (
          obstacle.type ===
          "bird"
        ) {

          obstacle.animation +=
            dt * 12;

        }


        /*
            =================================================
            COLISIÓN
            =================================================

            IMPORTANTE:

            Se recalcula cada frame.

            Esto significa que si el jugador
            se agacha justo antes de entrar
            en el pájaro bajo, la hitbox cambia
            inmediatamente.
        */

        const playerBox =
          getPlayerHitbox();


        const obstacleBox =
          getObstacleHitbox(
            obstacle
          );


        if (
          intersects(
            playerBox,
            obstacleBox
          )
        ) {

          gameOver();

          return;

        }


        /*
            PUNTUACIÓN
        */

        if (

          !obstacle.passed

          &&

          obstacle.x +
          obstacle.width <
          player.x

        ) {

          obstacle.passed =
            true;


          score +=
            10;

        }


        /*
            ELIMINAR OBSTÁCULO
        */

        if (
          obstacle.x +
          obstacle.width <
          -120
        ) {

          obstacles.splice(
            i,
            1
          );

        }

      }

    }


    /* =========================================================
       DIFICULTAD
    ========================================================= */

    function updateDifficulty(
      dt
    ) {

      speed +=
        3.5 * dt;


      speed =
        Math.min(
          speed,
          MAX_SPEED
        );

    }


    /* =========================================================
       FONDO
    ========================================================= */

    function drawBackground(
      time
    ) {


      /*
          FONDO
      */

      ctx.fillStyle =
        "#fff";


      ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
      );


      /*
          =====================================================
          NUBES
          =====================================================
      */

      const cloudOffset =
        (
          time * 0.007
        ) % 1400;


      drawCloud(
        150 -
        cloudOffset,
        75
      );


      drawCloud(
        620 -
        cloudOffset,
        115
      );


      drawCloud(
        1080 -
        cloudOffset,
        65
      );


      /*
          =====================================================
          MONTAÑAS
          =====================================================
      */

      ctx.fillStyle =
        "#eeeeee";


      drawMountain(
        80,
        300,
        220,
        90
      );


      drawMountain(
        420,
        330,
        180,
        60
      );


      drawMountain(
        720,
        285,
        240,
        105
      );


      drawMountain(
        1040,
        320,
        180,
        70
      );


      /*
          =====================================================
          SUELO
          =====================================================
      */

      ctx.fillStyle =
        "#111";


      ctx.fillRect(
        0,
        GROUND,
        WIDTH,
        3
      );


      /*
          Pequeñas marcas animadas.
      */

      const offset =
        (
          time *
          speed *
          0.0007
        ) % 120;


      for (
        let x =
          -offset;

        x <
        WIDTH + 120;

        x += 120
      ) {

        ctx.fillRect(
          x,
          GROUND + 24,
          44,
          3
        );

      }

    }


    /* =========================================================
       NUBE
    ========================================================= */

    function drawCloud(
      x,
      y
    ) {

      ctx.fillStyle =
        "#e9e9e9";


      ctx.fillRect(
        x,
        y,
        65,
        7
      );


      ctx.fillRect(
        x + 12,
        y - 7,
        36,
        7
      );


      ctx.fillRect(
        x + 28,
        y - 13,
        18,
        13
      );

    }


    /* =========================================================
       MONTAÑA
    ========================================================= */

    function drawMountain(
      x,
      y,
      width,
      height
    ) {

      ctx.beginPath();


      ctx.moveTo(
        x,
        GROUND
      );


      ctx.lineTo(
        x + width / 2,
        y
      );


      ctx.lineTo(
        x + width,
        GROUND
      );


      ctx.closePath();


      ctx.fill();

    }


    /* =========================================================
       DINOSAURIO
    ========================================================= */

    function drawRex(
      time
    ) {


      /*
          Cambia de sprite automáticamente
          según la postura.
      */

      const image =
        player.crouching

          ? images.rexCrouch

          : images.rex;


      let width;

      let height;


      /*
          POSTURA NORMAL
      */

      if (
        !player.crouching
      ) {

        width =
          94;

        height =
          78;

      }


      /*
          POSTURA AGACHADA
      */

      else {

        width =
          94;

        height =
          55;

      }


      /*
          Pequeña animación
          de carrera.
      */

      let bob =
        0;


      if (

        !player.jumping

        &&

        !player.crouching

      ) {

        bob =
          Math.sin(
            time * 0.018
          ) * 1.5;

      }


      ctx.drawImage(

        image,

        player.x - 18,

        player.y -
        height +
        bob,

        width,

        height

      );


      /*
          HITBOX DEBUG
      */

      if (
        DEBUG
      ) {

        const box =
          getPlayerHitbox();


        ctx.strokeStyle =
          "#00aa00";


        ctx.lineWidth =
          2;


        ctx.strokeRect(

          box.x,

          box.y,

          box.width,

          box.height

        );

      }

    }


    /* =========================================================
       CACTUS
    ========================================================= */

    function drawCactus(
      obstacle
    ) {


      ctx.drawImage(

        images.cactus,

        obstacle.x,

        obstacle.y -
        obstacle.height,

        obstacle.width,

        obstacle.height

      );


      if (
        DEBUG
      ) {

        const box =
          getObstacleHitbox(
            obstacle
          );


        ctx.strokeStyle =
          "#ff0000";


        ctx.lineWidth =
          2;


        ctx.strokeRect(

          box.x,

          box.y,

          box.width,

          box.height

        );

      }

    }


    /* =========================================================
       PÁJARO
    ========================================================= */

    function drawBird(
      obstacle
    ) {


      /*
          Movimiento de las alas.
      */

      const wing =
        Math.sin(
          obstacle.animation
        ) > 0
          ? 0
          : 5;


      /*
          =====================================================
          DIBUJO
          =====================================================
      */

      ctx.drawImage(

        images.bird,

        obstacle.x,

        obstacle.y -
        45 +
        wing,

        obstacle.width,

        60

      );


      /*
          =====================================================
          DEBUG
          =====================================================
      */

      if (
        DEBUG
      ) {

        const box =
          getObstacleHitbox(
            obstacle
          );


        ctx.strokeStyle =
          "#ff0000";


        ctx.lineWidth =
          2;


        ctx.strokeRect(

          box.x,

          box.y,

          box.width,

          box.height

        );


        /*
            Indicador visual de altura
        */

        ctx.fillStyle =
          "#ff0000";


        ctx.font =
          "bold 12px Courier New";


        ctx.fillText(

          obstacle.low
            ? "BAJO / AGACHARSE"
            : "ALTO / SALTAR",

          obstacle.x,

          obstacle.y - 52

        );

      }

    }


    /* =========================================================
       OBSTÁCULOS
    ========================================================= */

    function drawObstacles() {


      for (
        const obstacle
        of obstacles
      ) {


        if (
          obstacle.type ===
          "cactus"
        ) {

          drawCactus(
            obstacle
          );

        }

        else {

          drawBird(
            obstacle
          );

        }

      }

    }


    /* =========================================================
       HUD
    ========================================================= */

    function drawHUD() {


      ctx.fillStyle =
        "#111";


      ctx.font =
        "bold 15px Courier New";


      ctx.fillText(

        "SCORE " +

        String(
          Math.floor(
            score
          )
        ).padStart(
          5,
          "0"
        ),

        24,

        30

      );


      ctx.fillText(

        "BEST " +

        String(
          best
        ).padStart(
          5,
          "0"
        ),

        180,

        30

      );

    }


    /* =========================================================
       GAME OVER
    ========================================================= */

    function drawGameOver() {


      ctx.fillStyle =
        "rgba(255,255,255,.94)";


      ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
      );


      ctx.fillStyle =
        "#111";


      ctx.textAlign =
        "center";


      ctx.font =
        "bold 48px Courier New";


      ctx.fillText(

        "GAME OVER",

        WIDTH / 2,

        215

      );


      ctx.font =
        "bold 18px Courier New";


      ctx.fillText(

        "SCORE " +

        String(
          Math.floor(
            score
          )
        ).padStart(
          5,
          "0"
        ),

        WIDTH / 2,

        255

      );


      ctx.font =
        "bold 14px Courier New";


      ctx.fillText(

        "PULSA ENTER PARA REINICIAR",

        WIDTH / 2,

        295

      );


      ctx.textAlign =
        "left";

    }


    /* =========================================================
       GAME OVER
    ========================================================= */

    function gameOver() {


      running =
        false;


      best =
        Math.max(

          best,

          Math.floor(
            score
          )

        );


      localStorage.setItem(

        "pixelRexBest",

        best

      );

    }


    /* =========================================================
       REINICIAR
    ========================================================= */

    function resetGame() {


      obstacles =
        [];


      score =
        0;


      speed =
        285;


      spawnTimer =
        0;


      spawnDelay =
        1.8;


      player.y =
        GROUND;


      player.velocityY =
        0;


      player.jumping =
        false;


      player.crouching =
        false;


      keys.down =
        false;


      running =
        true;


      lastTime =
        performance.now();

    }


    /* =========================================================
       TECLADO
    ========================================================= */

    document.addEventListener(
      "keydown",
      event => {


        /*
            Evitar scroll del navegador.
        */

        if (

          event.code ===
          "Space"

          ||

          event.code ===
          "ArrowUp"

          ||

          event.code ===
          "ArrowDown"

        ) {

          event.preventDefault();

        }


        /*
            SALTO
        */

        if (

          (
            event.code ===
            "Space"

            ||

            event.code ===
            "ArrowUp"
          )

          &&

          !event.repeat

        ) {

          jump();

        }


        /*
            AGACHARSE
        */

        if (

          event.code ===
          "ArrowDown"

          ||

          event.code ===
          "KeyS"

        ) {

          keys.down =
            true;

        }


        /*
            REINICIAR
        */

        if (

          event.code ===
          "Enter"

          &&

          !running

        ) {

          resetGame();

        }

      }
    );


    /* =========================================================
       SOLTAR AGACHARSE
    ========================================================= */

    document.addEventListener(
      "keyup",
      event => {


        if (

          event.code ===
          "ArrowDown"

          ||

          event.code ===
          "KeyS"

        ) {

          keys.down =
            false;

        }

      }
    );


    /* =========================================================
       RATÓN
    ========================================================= */

    canvas.addEventListener(
      "mousedown",
      jump
    );


    /* =========================================================
       TÁCTIL
    ========================================================= */

    canvas.addEventListener(

      "touchstart",

      event => {

        event.preventDefault();

        jump();

      },

      {
        passive: false
      }

    );


    /* =========================================================
       LOOP PRINCIPAL
    ========================================================= */

    function gameLoop(
      timestamp
    ) {


      /*
          Delta time.
  
          Limitamos el máximo para evitar
          que un salto físico ocurra si
          el navegador se queda congelado.
      */

      let dt =
        (
          timestamp -
          lastTime
        ) / 1000;


      dt =
        Math.min(
          dt,
          0.025
        );


      lastTime =
        timestamp;


      if (
        running
      ) {

        updatePlayer(
          dt
        );


        updateObstacles(
          dt
        );


        updateDifficulty(
          dt
        );


        spawnTimer +=
          dt;


        if (
          spawnTimer >=
          spawnDelay
        ) {

          spawnTimer =
            0;


          spawnObstacle();


          spawnDelay =
            1.65 +
            Math.random() *
            0.75;

        }


        score +=
          dt * 7;

      }


      /*
          DIBUJAR
      */

      drawBackground(
        timestamp
      );


      drawObstacles();


      drawRex(
        timestamp
      );


      drawHUD();


      if (
        !running
      ) {

        drawGameOver();

      }


      requestAnimationFrame(
        gameLoop
      );

    }

  </script>

</body>

</html>
